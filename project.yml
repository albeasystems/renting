name: Renting
options:
  bundleIdPrefix: com.albeasystems
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 3A6D65SGG4
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
targets:
  Renting:
    type: application
    platform: iOS
    sources:
      - path: Renting
        excludes:
          - Info.plist
          - Renting.entitlements
      - path: Shared
    dependencies:
      - target: RentingWidget
    entitlements:
      path: Renting/Renting.entitlements
      properties:
        # iCloud sync (CloudKit, private database of the user's own account). `development` is
        # replaced by `production` automatically when archiving with automatic signing.
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.albeasystems.renting
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
        # Shared with the widget: the app leaves the figures it draws in this container.
        com.apple.security.application-groups:
          - group.com.albeasystems.renting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.albeasystems.renting
        INFOPLIST_FILE: Renting/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
  RentingWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: RentingWidget
        excludes:
          - Info.plist
          - RentingWidget.entitlements
      - path: Shared
    info:
      path: RentingWidget/Info.plist
      properties:
        CFBundleDisplayName: Renting
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: RentingWidget/RentingWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.albeasystems.renting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.albeasystems.renting.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SKIP_INSTALL: YES
schemes:
  Renting:
    build:
      targets:
        Renting: all
    run:
      config: Debug
      storeKitConfiguration: Renting/Renting.storekit
    archive:
      config: Release
